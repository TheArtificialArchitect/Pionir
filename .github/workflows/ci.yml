name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pionir ships a Windows desktop shell and PowerShell installers, so
        # Windows is a target platform and not just a developer convenience.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # pyproject's runtime dependencies: tzdata is the zone database zoneinfo needs on
        # Windows (worklog, proteus_day), where the OS has none Python can read
        run: python -m pip install "pillow>=10.1" "tzdata; sys_platform == 'win32'"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
