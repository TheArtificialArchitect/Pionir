[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pionir-agent"
version = "0.1.0"
description = "A resource-aware orchestration spine for a modular personal AI system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Ian Lee" }]
dependencies = [
  "pillow>=10.1",  # social/card.py draws the Instagram card (variable-font axes need 10.1+)
  "tzdata; sys_platform == 'win32'",  # worklog.py: zoneinfo has no zone database on Windows
]

[project.optional-dependencies]
video = [
  "kokoro-onnx",  # video/narrate.py: the narration voice, CPU only (model files live under Galatea)
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
pionir = "pionir.cli:main"
pionir-desktop = "pionir.desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pionir"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
